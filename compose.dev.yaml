name: mori

# Local credentials only. Production supplies DATABASE_URL_FILE and POSTGRES_PASSWORD separately.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: mori_secret
    ports:
      - "127.0.0.1:5432:5432"

  migrate:
    environment:
      DATABASE_URL: postgresql://mori:mori_secret@postgres:5432/mori_db

  api:
    environment:
      DATABASE_URL: postgresql://mori:mori_secret@postgres:5432/mori_db
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    environment:
      DATABASE_URL: postgresql://mori:mori_secret@postgres:5432/mori_db

  web:
    ports:
      - "127.0.0.1:3000:3000"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
