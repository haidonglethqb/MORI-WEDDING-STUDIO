name: mori

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mori
      POSTGRES_DB: mori_db
      # Password is supplied by compose.dev.yaml (local) or a secret file in production.
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mori -d mori_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: no

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      APP_ENV: development
      API_INTERNAL_ORIGIN: http://api:4000
      PORT: "4000"
      MEDIA_ROOT: /var/mori/media
    volumes:
      - media_data:/var/mori/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/v1/health/live').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      APP_ENV: development
      API_INTERNAL_ORIGIN: http://api:4000
      PORT: "4000"
      MEDIA_ROOT: /var/mori/media
    volumes:
      - media_data:/var/mori/media
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    environment:
      NODE_ENV: production
      API_INTERNAL_ORIGIN: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  media_data:
