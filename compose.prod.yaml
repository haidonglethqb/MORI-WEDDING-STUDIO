name: mori

# Production Docker Compose overrides for MORI Wedding Studio
# Used on the VPS: docker compose -f compose.yaml -f compose.prod.yaml up -d
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mori_prod_secret}
    restart: unless-stopped

  migrate:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-haidonglethqb}/mori-migrate:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://mori:${POSTGRES_PASSWORD:-mori_prod_secret}@postgres:5432/mori_db
    restart: "no"

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-haidonglethqb}/mori-api:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://mori:${POSTGRES_PASSWORD:-mori_prod_secret}@postgres:5432/mori_db
      REDIS_URL: redis://redis:6379
      SMTP_HOST: "${SMTP_HOST:-mail.moriwedding.xyz}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-mori@moriwedding.xyz}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-MORI Wedding Studio <mori@moriwedding.xyz>}"
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_BASE_URL: ${CODEX_BASE_URL:-https://api.modelapi.vn/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PORT: "4000"
      API_INTERNAL_ORIGIN: http://api:4000
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://moriwedding.xyz}
      PUBLIC_INVITE_ORIGIN: ${PUBLIC_INVITE_ORIGIN:-https://moriwedding.xyz}
      MEDIA_ROOT: /var/mori/media
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-haidonglethqb}/mori-worker:${IMAGE_TAG:-latest}
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://mori:${POSTGRES_PASSWORD:-mori_prod_secret}@postgres:5432/mori_db
      REDIS_URL: redis://redis:6379
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: "${SMTP_PORT:-1025}"
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      CODEX_BASE_URL: ${CODEX_BASE_URL:-https://api.modelapi.vn/v1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      PORT: "4000"
      API_INTERNAL_ORIGIN: http://api:4000
      MEDIA_ROOT: /var/mori/media
    restart: unless-stopped

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_REPO:-haidonglethqb}/mori-web:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      API_INTERNAL_ORIGIN: http://api:4000
      PUBLIC_APP_ORIGIN: ${PUBLIC_APP_ORIGIN:-https://moriwedding.xyz}
      PUBLIC_INVITE_ORIGIN: ${PUBLIC_INVITE_ORIGIN:-https://moriwedding.xyz}
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  caddy:
    image: caddy:2.11.9-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  redis:
    restart: unless-stopped

  mailpit:
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
