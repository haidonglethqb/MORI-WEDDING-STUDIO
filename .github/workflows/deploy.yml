name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mori
          POSTGRES_PASSWORD: mori_secret
          POSTGRES_DB: mori_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack & Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.16.1 --activate

      - name: Install Monorepo Dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://mori:mori_secret@localhost:5432/mori_db
        run: corepack pnpm db:generate

      - name: Check Import Boundaries
        run: corepack pnpm check:boundaries

      - name: Typecheck
        env:
          DATABASE_URL: postgresql://mori:mori_secret@localhost:5432/mori_db
        run: corepack pnpm typecheck

  build-and-push:
    name: Build & Push Docker Images
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web, worker, migrate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mori-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/mori-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Remote VPS
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Docker Compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "compose.yaml,compose.prod.yaml"
          target: "/opt/mori"

      - name: Deploy containers via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REPO_OWNER,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd /opt/mori

            # Generate default .env if not exists
            if [ ! -f .env ]; then
              echo "Generating initial /opt/mori/.env..."
              cat <<ENVEOF > .env
            APP_ENV=production
            NODE_ENV=production
            POSTGRES_USER=mori
            POSTGRES_DB=mori_db
            POSTGRES_PASSWORD=$(openssl rand -hex 16)
            IMAGE_REGISTRY=ghcr.io
            IMAGE_REPO=${REPO_OWNER,,}
            IMAGE_TAG=latest
            PUBLIC_APP_ORIGIN=http://${{ secrets.SSH_HOST }}
            PUBLIC_INVITE_ORIGIN=http://${{ secrets.SSH_HOST }}
            API_INTERNAL_ORIGIN=http://api:4000
            ENVEOF
            fi

            # Pull images and start services
            echo "Pulling newest images from GHCR..."
            docker compose -f compose.yaml -f compose.prod.yaml pull || true

            echo "Starting containers..."
            docker compose -f compose.yaml -f compose.prod.yaml up -d --remove-orphans

            echo "Deployment verification:"
            docker compose -f compose.yaml -f compose.prod.yaml ps

            echo "Cleaning dangling images..."
            docker image prune -f
