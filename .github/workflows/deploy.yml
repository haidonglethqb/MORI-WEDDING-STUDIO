name: Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, web, worker, migrate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push ${{ matrix.service }} Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.${{ matrix.service }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/mori-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/mori-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to Remote VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Compose and Deploy Scripts to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "compose.yaml,compose.prod.yaml,infra/caddy/Caddyfile,scripts/deploy-compose.sh,scripts/clean-vps.sh"
          target: "/opt/mori"

      - name: Execute Automated Deployment on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SSH_HOST }}
          IMAGE_TAG: ${{ github.sha }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          CODEX_BASE_URL: ${{ secrets.CODEX_BASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PUBLIC_APP_ORIGIN: https://moriwedding.xyz
          PUBLIC_INVITE_ORIGIN: https://moriwedding.xyz
          SMTP_HOST: mail.moriwedding.xyz
          SMTP_PORT: "465"
          SMTP_SECURE: "true"
          SMTP_USER: mori@moriwedding.xyz
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: 'MORI Wedding Studio <mori@moriwedding.xyz>'
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: REPO_OWNER,GHCR_USER,GHCR_TOKEN,SERVER_HOST,IMAGE_TAG,CODEX_API_KEY,CODEX_BASE_URL,GROQ_API_KEY,PUBLIC_APP_ORIGIN,PUBLIC_INVITE_ORIGIN,SMTP_HOST,SMTP_PORT,SMTP_SECURE,SMTP_USER,SMTP_PASSWORD,SMTP_FROM
          script: |
            tr -d '\r' < /opt/mori/scripts/deploy-compose.sh > /opt/mori/deploy.sh
            tr -d '\r' < /opt/mori/scripts/clean-vps.sh > /opt/mori/clean-vps.sh
            chmod +x /opt/mori/deploy.sh /opt/mori/clean-vps.sh
            /opt/mori/deploy.sh
